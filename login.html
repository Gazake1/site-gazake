<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gazake Bots — Login</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Gazake Bots</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="signup.html" class="btn-primary">Cadastro</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <section class="form-card">
      <h2>Entrar</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <p>Não tem conta? <a href="signup.html">Cadastre-se</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Gazake Bots. Todos os direitos reservados.</div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
