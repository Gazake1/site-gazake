<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gazake Bots — Cadastro</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Gazake Bots</h1>
      <nav>
        <!-- <a href="index.html">Home</a> -->
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="container form-page">
    <section class="form-card">
      <h2>Cadastro</h2>
      <form id="signupForm">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="emailSignup" name="email" required>

        <label for="password">Senha</label>
        <input type="password" id="passwordSignup" name="password" required>

        <label for="confirm">Confirmar senha</label>
        <input type="password" id="confirm" name="confirm" required>

        <button type="submit" class="btn-primary">Criar conta</button>
      </form>
      <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Gazake Bots. Todos os direitos reservados.</div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
